# Sunucuda Nginx (host) — Docker frontend 127.0.0.1:3001, backend 127.0.0.1:8000
#
# Kurulum örneği (Debian/Ubuntu):
#   sudo cp deploy/nginx-host/ore-oar.online.conf /etc/nginx/sites-available/ore-oar.online
#   sudo ln -sf /etc/nginx/sites-available/ore-oar.online /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d ore-oar.online -d www.ore-oar.online

upstream bio_dash_frontend {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream bio_dash_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ore-oar.online www.ore-oar.online;

    client_max_body_size 2g;

    location /backend/ {
        proxy_pass http://bio_dash_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://bio_dash_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
