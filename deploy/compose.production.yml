# Üretim override: domain ve build argümanları.
# Kullanım (bio-dash klasöründe, backend ../backend ile yan yana olmalı):
#   docker compose -f docker-compose.yml -f deploy/compose.production.yml --env-file .env up -d --build
#
# Portları sadece localhost'a bağlamak için .env içinde tanımlayın (deploy/env.production.example).
# Ana compose dosyası container portunu eklediği için sadece host:host_port kullanın, örn. FRONTEND_PORT=127.0.0.1:3001
#
# Not: NEXT_PUBLIC_* istemci bundle'a build sırasında girer; domain değişirse --build şart.

services:
  backend:
    environment:
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://ore-oar.online,https://www.ore-oar.online}

  frontend-migrate:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://ore-oar.online/backend}

  frontend:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://ore-oar.online/backend}
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://ore-oar.online}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://ore-oar.online/backend}
